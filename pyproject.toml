[project]
name = "universal-cognitive-lab"
version = "0.1.0"
description = "Independent modular neural learning laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
 "torch==2.11.0", "numpy>=2,<3", "xminigrid==0.9.3",
 "jax==0.4.38", "jaxlib==0.4.38", "flax==0.10.2", "chex==0.1.88",
 "transformers==4.57.6", "accelerate==1.12.0", "mlflow-skinny==3.17.0",
 "streamlit>=1.40,<2", "pillow>=11,<13", "psutil>=7,<8", "imageio>=2,<3"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
ucl = "ucl.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ucl"]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
